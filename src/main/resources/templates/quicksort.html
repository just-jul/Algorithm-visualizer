<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSort</title>
    <link th:href="@{/output.css}" rel="stylesheet">
</head>
<body>
    
    <div class="flex justify-center items-center h-screen w-screen">

        <!-- input section -->
        <div class="m-4">
            <label for="array-elements" class="text-base">Enter array elements: </label>
        <input type="text" name="elements" placeholder="3, 4, 5" class="block min-w-120 grow bg-gray-200 py-1.5 pr-3 pl-1 font-medium text-white rounded placeholder:text-gray-500 focus:outline-none text-base sm:text-sm/6">
        </div>
    
        <button id="btn" class="m-4 bg-blue-500 text-white font-medium rounded px-6 py-2 hover:bg-blue-700 cursor-pointer">
            Sort
        </button>
    

        <!-- sorting section -->
        <div class="flex justify-center items-center">
            <svg width="600" height="500" border-blue-500 style="background: #f4f4f4;">
                <g class="self-center">
                    <g transform="translate(10, 440)"> 
                        <rect height="60" width="45" style="fill: rgb(173, 216, 230);"></rect>
                        <text text-anchor="middle" fill="black" font-weight="bold">6</text>
                    </g>
                    <g transform="translate(60, 300)"> 
                        <rect height="200" width="45" style="fill: rgb(173, 216, 230);"></rect>
                        <text text-anchor="middle" fill="black" font-weight="bold">20</text>
                    </g>
                    <g transform="translate(120, 420)"> 
                        <rect height="80" width="45" style="fill: rgb(173, 216, 230);"></rect>
                        <text text-anchor="middle" fill="black" font-weight="bold">8</text>
                    </g>
                    <g transform="translate(180, 320)"> 
                        <rect height="180" width="45" style="fill: rgb(173, 216, 230);"></rect>
                        <text text-anchor="middle" fill="black" font-weight="bold">18</text>
                    </g>
                </g>

            </svg>
            
        </div>

        <div>

        </div>

        
    </div>

    <script>

        const sortButton = document.getElementById("btn");

        sortButton.addEventListener("click", async ()=> {
            const array = [6, 20, 1, 18];

            const response = await fetch("http://localhost:8080/api/sort", { // api/sort is the endpoint specified in controller
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ array: array, algorithm: "bubble" })
            });

            const data = await response.json();
            animateSteps(data.steps);
            }
        );
    
    </script>

</body>
</html>
